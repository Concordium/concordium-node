name: Docker node image release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing ECR RC tag to publish (for example 1.2.3-4-rc)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-node-image-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_REPOSITORY: concordium/node

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.source.outputs.digest }}
      revision: ${{ steps.source.outputs.revision }}
      public_version: ${{ steps.source.outputs.public_version }}
    steps:
      - name: Validate release request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the reviewed default-branch workflow for public publication.
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Run this workflow from the default branch.'
            exit 1
          fi
          # Reject alpha and manual builds before requesting release approval.
          if [[ ! "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-rc$ ]]; then
            echo '::error::Only RC build tags can be released. Alpha and manual builds are not eligible.'
            exit 1
          fi
          # Validate the staging destination before AWS authentication.
          if [[ ! "$ECR_REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ || -z "$AWS_REGION" ]]; then
            echo '::error::Configure AWS_REGION and the full ECR_REPOSITORY URI.'
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.5.0

      - name: Pin and verify staging image
        id: source
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Pin the selected staging tag before approval. Publication uses this digest.
          source_digest=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids "imageTag=$SOURCE_VERSION" --query 'imageDetails[0].imageDigest' --output text)
          if [[ ! "$source_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Could not resolve the staging digest.'
            exit 1
          fi
          # Trust only the build workflow identity for the selected RC Git tag.
          source_ref="$ECR_REPOSITORY@$source_digest"
          build_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker-build.yaml@refs/tags/$SOURCE_VERSION"
          cosign verify --certificate-identity "$build_identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$source_ref"
          # Check the signed image labels against the requested version and Git commit.
          docker pull "$source_ref"
          image_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source_ref")
          image_version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$source_ref")
          # Resolve lightweight and annotated Git tags to their commit.
          tag_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_VERSION" --jq .sha)
          if [[ ! "$image_revision" =~ ^[a-f0-9]{40}$ || "$image_revision" != "$tag_revision" || "$image_version" != "$SOURCE_VERSION" ]]; then
            echo '::error::Staging image metadata does not match the RC Git tag.'
            exit 1
          fi
          # Pass the verified digest to publication and retain the existing public tag format.
          {
            echo "digest=$source_digest"
            echo "revision=$image_revision"
            echo "public_version=${SOURCE_VERSION%-rc}"
          } >> "$GITHUB_OUTPUT"
          # Give reviewers the source revision and digest before they approve publication.
          {
            echo '## Docker node release request'
            printf '\n- Staging version: `%s`\n' "$SOURCE_VERSION"
            printf -- '- Source revision: `%s`\n' "$image_revision"
            printf -- '- Pinned ECR digest: `%s`\n' "$source_digest"
            printf -- '- Public version: `%s`\n' "${SOURCE_VERSION%-rc}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    env:
      SOURCE_DIGEST: ${{ needs.validate.outputs.digest }}
      SOURCE_REVISION: ${{ needs.validate.outputs.revision }}
      PUBLIC_VERSION: ${{ needs.validate.outputs.public_version }}
      SOURCE_VERSION: ${{ inputs.version }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.5.0

      - name: Verify approved image
        shell: bash
        run: |
          set -euo pipefail
          # Verify again after approval. Do not select a new digest from the staging tag.
          build_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker-build.yaml@refs/tags/$SOURCE_VERSION"
          cosign verify --certificate-identity "$build_identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ECR_REPOSITORY@$SOURCE_DIGEST"

      - name: Copy image to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          # Allow matching retries, but never replace a public version with another digest.
          destination_ref="$IMAGE_REPOSITORY:$PUBLIC_VERSION"
          manifest_error=$(mktemp)
          trap 'rm -f "$manifest_error"' EXIT
          if existing_digest=$(docker buildx imagetools inspect "$destination_ref" --format '{{.Manifest.Digest}}' 2>"$manifest_error"); then
            if [[ "$existing_digest" != "$SOURCE_DIGEST" ]]; then
              echo '::error::The public version already identifies a different image.'
              exit 1
            fi
          # Only an absent manifest permits publication. Other registry errors fail.
          elif grep --extended-regexp --ignore-case --quiet 'manifest unknown|no such manifest' "$manifest_error" ||
               grep --fixed-strings --line-regexp --quiet "ERROR: docker.io/$destination_ref: not found" "$manifest_error"; then
            # Copy the manifest and layers. Do not create an image index.
            docker buildx imagetools create --prefer-index=false --tag "$destination_ref" "$ECR_REPOSITORY@$SOURCE_DIGEST"
          else
            cat "$manifest_error" >&2
            echo '::error::Could not check the public version.'
            exit 1
          fi
          # Confirm that the registry copy preserved the approved manifest digest.
          public_digest=$(docker buildx imagetools inspect "$destination_ref" --format '{{.Manifest.Digest}}')
          if [[ "$public_digest" != "$SOURCE_DIGEST" ]]; then
            echo '::error::The public image digest differs from the approved staging digest.'
            exit 1
          fi
          # Record both registry references and the source revision for the release audit.
          {
            echo '## Docker node public release'
            printf '\n- Staging version: `%s`\n' "$SOURCE_VERSION"
            printf -- '- Source revision: `%s`\n' "$SOURCE_REVISION"
            printf -- '- ECR digest: `%s`\n' "$SOURCE_DIGEST"
            printf -- '- Docker Hub image: `%s@%s`\n' "$IMAGE_REPOSITORY" "$public_digest"
            printf -- '- Public tag: `%s`\n' "$destination_ref"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign public image
        shell: bash
        run: |
          set -euo pipefail
          # Create a public signature with this release workflow's identity.
          # A retry can complete signing without copying the image again.
          cosign sign --yes "$IMAGE_REPOSITORY@$SOURCE_DIGEST"
