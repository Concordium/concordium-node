name: Docker node image E2E
run-name: Docker node image E2E — tests ${{ inputs.e2e_ref }}

on:
  workflow_dispatch:
    inputs:
      e2e_ref:
        description: E2E testing branch, tag, or commit
        required: true
        default: f0bd39205811425d8fd7d3db0982d49e16c78b9f
        type: string

permissions:
  contents: read

env:
  IMAGE_REF: concordium/node:e2e-${{ github.sha }}

jobs:
  e2e:
    name: Build image and run E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout node repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/distribution/docker-image/builder.Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          provenance: false
          tags: ${{ env.IMAGE_REF }}

      - name: Checkout E2E test suite
        uses: actions/checkout@v4
        with:
          repository: Concordium/e2e-testing
          ref: ${{ inputs.e2e_ref }}
          path: e2e-testing
          submodules: recursive
          persist-credentials: false

      - name: Run E2E tests
        working-directory: e2e-testing
        run: cargo run --release --locked -- --image "${{ env.IMAGE_REF }}"
