name: Docker node description release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Docker node image release
    types:
      - completed

concurrency:
  group: docker-node-description-release
  cancel-in-progress: false

jobs:
  publish-description:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Publish Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: concordium/node
          readme-filepath: scripts/distribution/docker-image/hub-description.md
